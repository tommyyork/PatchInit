<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Front-panel PCB artwork for the Resynthesis module (Patch.Init format).
  Units: mm. Size: 3U x 10HP (128.5 x 50.8 mm).
  All labels centered on their drill; jack labels above each jack.
  Font: open-source DIN-style (see README). All text all caps.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="50.8mm"
  height="128.5mm"
  viewBox="0 0 50.8 128.5"
>
  <defs>
    <style type="text/css">
      .panel-text { font-family: Gidole, 'DIN Alternate', 'DIN 2014', sans-serif; }
    </style>
    <!-- Copper-only background patterns:
         - Left: large broken squares
         - Middle: debris/fragmented lines (letters washing off)
         - Right: large broken circles
         All strokes use a single copper colour with no fills or tones. -->

    <!-- Left: large broken squares (rect only, no circles) -->
    <pattern id="patternSquares" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="4"
            fill="none"
            stroke="#d4af37"
            stroke-width="0.2"
            stroke-dasharray="2 1" />
    </pattern>

    <!-- Middle: debris / falling fragments -->
    <pattern id="patternDebris" width="4" height="4" patternUnits="userSpaceOnUse">
      <!-- Short, staggered segments suggesting pieces falling off -->
      <line x1="0.5" y1="0.4" x2="2.0" y2="0.4"
            stroke="#d4af37"
            stroke-width="0.18" />
      <line x1="2.2" y1="1.4" x2="3.5" y2="1.4"
            stroke="#d4af37"
            stroke-width="0.18"
            stroke-dasharray="0.6 0.4" />
      <line x1="0.2" y1="2.1" x2="1.4" y2="2.7"
            stroke="#d4af37"
            stroke-width="0.18" />
      <line x1="2.0" y1="2.8" x2="3.8" y2="3.2"
            stroke="#d4af37"
            stroke-width="0.18"
            stroke-dasharray="0.4 0.6" />
    </pattern>

    <!-- Right: circle-like fragments built from short line segments (no <circle> elements) -->
    <pattern id="patternCircles" width="4" height="4" patternUnits="userSpaceOnUse">
      <!-- Four short chords hinting at a circle outline -->
      <line x1="1.0" y1="0.8" x2="2.4" y2="0.6"
            stroke="#d4af37"
            stroke-width="0.2" />
      <line x1="2.6" y1="1.0" x2="3.2" y2="2.0"
            stroke="#d4af37"
            stroke-width="0.2" />
      <line x1="3.0" y1="2.6" x2="1.8" y2="3.2"
            stroke="#d4af37"
            stroke-width="0.2" />
      <line x1="1.0" y1="3.0" x2="0.6" y2="1.8"
            stroke="#d4af37"
            stroke-width="0.2" />
    </pattern>

    <!-- Masks to grade the background from squares (left) through debris (middle) to circles (right).
         Squares are present across the full panel; debris and circle fragments become denser toward the right. -->
    <mask id="maskLeft">
      <!-- Squares everywhere -->
      <rect x="0" y="0" width="50.8" height="128.5" fill="white" />
    </mask>
    <mask id="maskMid">
      <!-- Debris mainly in the centre, with a soft-edged, irregular band -->
      <rect x="10" y="0" width="14" height="128.5" fill="white" />
      <rect x="18" y="0" width="12" height="128.5" fill="white" />
      <rect x="24" y="0" width="10" height="128.5" fill="white" />
    </mask>
    <mask id="maskRight">
      <!-- Circle fragments sparse in the mid-right, dense at the far right -->
      <rect x="26" y="0" width="8" height="128.5" fill="white" />
      <rect x="32" y="0" width="10" height="128.5" fill="white" />
      <rect x="38" y="0" width="12.8" height="128.5" fill="white" />
    </mask>
  </defs>

  <rect x="0" y="0" width="50.8" height="128.5" fill="#050505" />
  <!-- Background transition: squares -> debris -> circles (all rects full-size, sliced by masks) -->
  <rect x="0" y="0" width="50.8" height="128.5" fill="url(#patternSquares)" mask="url(#maskLeft)" />
  <rect x="0" y="0" width="50.8" height="128.5" fill="url(#patternDebris)" mask="url(#maskMid)" />
  <rect x="0" y="0" width="50.8" height="128.5" fill="url(#patternCircles)" mask="url(#maskRight)" />
  <rect x="0.15" y="0.15" width="50.5" height="128.2" fill="none" stroke="#d4af37" stroke-width="0.3" />

  <!-- Title (above all drills) -->
  <rect x="15.200" y="4.200" width="20.400" height="5.200" rx="1.600" fill="#000000" stroke="none" data-panel-role="label-bg" />
  <text x="25.4" y="8" class="panel-text" font-size="4" text-anchor="middle" fill="#ffffff">&#21270;</text>
  <rect x="12.920" y="9.520" width="24.960" height="4.800" rx="1.440" fill="#000000" stroke="none" data-panel-role="label-bg" />
  <text x="25.4" y="13" class="panel-text" font-size="3.6" text-anchor="middle" fill="#f5e3a1">RESYNTHESIS</text>

  <!-- Mounting screw slots: wide rectangular, aligned with Eurorack rails (3 mm from top/bottom) -->
  <rect x="5.000" y="1.500" width="5.000" height="3.000" rx="1.0" fill="#000000" stroke="#ffffff" stroke-width="0.2" />
  <rect x="40.600" y="1.500" width="5.000" height="3.000" rx="1.0" fill="#000000" stroke="#ffffff" stroke-width="0.2" />
  <rect x="5.000" y="124.000" width="5.000" height="3.000" rx="1.0" fill="#000000" stroke="#ffffff" stroke-width="0.2" />
  <rect x="40.600" y="124.000" width="5.000" height="3.000" rx="1.0" fill="#000000" stroke="#ffffff" stroke-width="0.2" />

  <!-- SD card holder cutout (matches patch_init_gerbers/blank-Edge_Cuts.gbr) -->
  <rect x="24.14" y="33.493" width="3.208" height="12.802" fill="none" stroke="#ffffff" stroke-width="0.2" />

  <!-- Pots CV_1-CV_4 (9MM_SNAP-IN_POT… → 7.5 mm panel holes) -->
  <circle cx="11.176" cy="22.904" r="3.750" fill="#000000" stroke="#ffffff" stroke-width="0.3" />
  <circle cx="39.65" cy="22.904" r="3.750" fill="#000000" stroke="#ffffff" stroke-width="0.3" />
  <circle cx="11.176" cy="42.027" r="3.750" fill="#000000" stroke="#ffffff" stroke-width="0.3" />
  <circle cx="39.65" cy="42.027" r="3.750" fill="#000000" stroke="#ffffff" stroke-width="0.3" />

  <!-- Labels beneath pots row 1 (y >= 26.5), font 3.6 mm (>= 10 pt); clear of 12mm knob -->
  <rect x="0.856" y="29.520" width="20.640" height="4.800" rx="1.440" fill="#000000" stroke="none" data-panel-role="label-bg" />
  <text x="11.176" y="33" class="panel-text" font-size="3.6" text-anchor="middle" fill="#ffffff">DRY / WET</text>
  <rect x="32.570" y="29.520" width="14.160" height="4.800" rx="1.440" fill="#000000" stroke="none" data-panel-role="label-bg" />
  <text x="39.65" y="33" class="panel-text" font-size="3.6" text-anchor="middle" fill="#ffffff">SMOOTH</text>

  <!-- Labels beneath pots row 2 (y >= 45.6); clear of knob. CV_3 labeled FLUFF, CV_4 labeled COLOR -->
  <rect x="5.176" y="48.520" width="12.000" height="4.800" rx="1.440" fill="#000000" stroke="none" data-panel-role="label-bg" />
  <text x="11.176" y="52" class="panel-text" font-size="3.6" text-anchor="middle" fill="#ffffff">FLUFF</text>
  <rect x="33.650" y="48.520" width="12.000" height="4.800" rx="1.440" fill="#000000" stroke="none" data-panel-role="label-bg" />
  <text x="39.65" y="52" class="panel-text" font-size="3.6" text-anchor="middle" fill="#ffffff">COLOR</text>

  <!-- T2 LED; T3/T4 jacks and switches -->
  <circle cx="25.4" cy="19.252" r="1.6" fill="#000000" stroke="#ffffff" stroke-width="0.2" />
  <!-- B_7 (MAX COMP) uses TL1105… footprint → 5.5 mm panel hole.
       B_8 (PITCH LOCK) uses a toggle on the jack-family 6.2 mm drill → 6.2 mm panel hole. -->
  <circle cx="8.65" cy="59.288" r="2.750" fill="#000000" stroke="#ffffff" stroke-width="0.3" />
  <circle cx="25.503" cy="61.957" r="3.400" fill="#000000" stroke="#ffffff" stroke-width="0.3" />

  <!-- All jacks use S_JACK footprints → 6.3 mm panel holes -->
  <circle cx="7.15" cy="84.562" r="3.150" fill="#000000" stroke="#ffffff" stroke-width="0.2" />
  <circle cx="7.15" cy="98.312" r="3.150" fill="#000000" stroke="#ffffff" stroke-width="0.2" />
  <circle cx="7.15" cy="111.9" r="3.150" fill="#000000" stroke="#ffffff" stroke-width="0.2" />
  <circle cx="19.317" cy="84.562" r="3.150" fill="#000000" stroke="#ffffff" stroke-width="0.2" />
  <circle cx="19.317" cy="98.312" r="3.150" fill="#000000" stroke="#ffffff" stroke-width="0.2" />
  <circle cx="19.317" cy="111.9" r="3.150" fill="#000000" stroke="#ffffff" stroke-width="0.2" />
  <circle cx="31.483" cy="84.562" r="3.150" fill="#000000" stroke="#ffffff" stroke-width="0.2" />
  <circle cx="31.483" cy="98.312" r="3.150" fill="#000000" stroke="#ffffff" stroke-width="0.2" />
  <circle cx="31.483" cy="111.9" r="3.150" fill="#000000" stroke="#ffffff" stroke-width="0.2" />
  <circle cx="42.155" cy="59.288" r="3.150" fill="#000000" stroke="#ffffff" stroke-width="0.2" />
  <circle cx="43.65" cy="84.562" r="3.150" fill="#000000" stroke="#ffffff" stroke-width="0.2" />
  <circle cx="43.65" cy="98.312" r="3.150" fill="#000000" stroke="#ffffff" stroke-width="0.2" />
  <circle cx="43.65" cy="111.9" r="3.150" fill="#000000" stroke="#ffffff" stroke-width="0.2" />

  <!-- Output jack grouping: individual rounded rectangles centered on each jack. -->
  <!-- CV_OUT_1 at (42.155, 59.288) -->
  <rect x="38.155" y="55.288" width="8.0" height="8.0" rx="1.2"
        fill="#ffffff" stroke="#ffffff" stroke-width="0.2" />
  <!-- B5 at (31.483, 84.562) -->
  <rect x="27.483" y="80.562" width="8.0" height="8.0" rx="1.2"
        fill="#ffffff" stroke="#ffffff" stroke-width="0.2" />
  <!-- B6 at (43.65, 84.562) -->
  <rect x="39.650" y="80.562" width="8.0" height="8.0" rx="1.2"
        fill="#ffffff" stroke="#ffffff" stroke-width="0.2" />
  <!-- OUT L at (31.483, 111.9) -->
  <rect x="27.483" y="107.900" width="8.0" height="8.0" rx="1.2"
        fill="#ffffff" stroke="#ffffff" stroke-width="0.2" />
  <!-- OUT R at (43.65, 111.9) -->
  <rect x="39.650" y="107.900" width="8.0" height="8.0" rx="1.2"
        fill="#ffffff" stroke="#ffffff" stroke-width="0.2" />

  <!-- Left switch (B_7, MAX COMP) at (8.65, 59.288): panel label split over two lines -->
  <rect x="4.873" y="63.076" width="7.554" height="4.730" rx="1.412" fill="#000000" stroke="none" data-panel-role="label-bg" />
  <text x="8.65" y="66.5" class="panel-text" font-size="3.53" text-anchor="middle" fill="#ffffff">MAX</text>
  <rect x="3.814" y="66.606" width="9.672" height="4.730" rx="1.412" fill="#000000" stroke="none" data-panel-role="label-bg" />
  <text x="8.65" y="70.03" class="panel-text" font-size="3.53" text-anchor="middle" fill="#ffffff">COMP</text>

  <!-- Centre switch (B_8, mode) at (25.503, 61.957): panel label PITCH LOCK, split over two lines.
       The top line is moved down so that the minimum vertical clearance from the drill center
       matches the padding used for THOUGHTS and MAX COMP. -->
  <rect x="19.608" y="65.776" width="11.790" height="4.730" rx="1.412" fill="#000000" stroke="none" data-panel-role="label-bg" />
  <text x="25.503" y="69.2" class="panel-text" font-size="3.53" text-anchor="middle" fill="#ffffff">PITCH</text>
  <rect x="20.667" y="69.306" width="9.672" height="4.730" rx="1.412" fill="#000000" stroke="none" data-panel-role="label-bg" />
  <text x="25.503" y="72.73" class="panel-text" font-size="3.53" text-anchor="middle" fill="#ffffff">LOCK</text>

  <!-- CV_OUT_1 / C10 jack at (42.155, 59.288): panel label THOUGHTS (rendered as !!! on panel) -->
  <rect x="38.378" y="63.476" width="7.554" height="4.730" rx="1.412" fill="#000000" stroke="none" data-panel-role="label-bg" />
  <text x="42.155" y="66.9" class="panel-text" font-size="3.53" text-anchor="middle" fill="#ffffff">!!!</text>

  <!-- 12 jacks: labels OVER each jack, centered. Top row (y=84.562) ? B10, B9, B5, B6 -->
  <rect x="3.310" y="75.520" width="7.680" height="4.800" rx="1.440" fill="#000000" stroke="none" data-panel-role="label-bg" />
  <text x="7.15" y="79.0" class="panel-text" font-size="3.6" text-anchor="middle" fill="#ffffff">B10</text>
  <rect x="16.557" y="75.520" width="5.520" height="4.800" rx="1.440" fill="#000000" stroke="none" data-panel-role="label-bg" />
  <text x="19.317" y="79.0" class="panel-text" font-size="3.6" text-anchor="middle" fill="#ffffff">B9</text>
  <rect x="28.723" y="75.520" width="5.520" height="4.800" rx="1.440" fill="#000000" stroke="none" data-panel-role="label-bg" />
  <text x="31.483" y="79.0" class="panel-text" font-size="3.6" text-anchor="middle" fill="#ffffff">B5</text>
  <rect x="40.890" y="75.520" width="5.520" height="4.800" rx="1.440" fill="#000000" stroke="none" data-panel-role="label-bg" />
  <text x="43.65" y="79.0" class="panel-text" font-size="3.6" text-anchor="middle" fill="#ffffff">B6</text>

  <!-- Middle row (y=98.312) ? V/OCT, TIME, DENSITY, D (italic, diffusion) -->
  <rect x="1.150" y="89.320" width="12.000" height="4.800" rx="1.440" fill="#000000" stroke="none" data-panel-role="label-bg" />
  <text x="7.15" y="92.8" class="panel-text" font-size="3.6" text-anchor="middle" fill="#ffffff">V/OCT</text>
  <rect x="14.397" y="89.320" width="9.840" height="4.800" rx="1.440" fill="#000000" stroke="none" data-panel-role="label-bg" />
  <text x="19.317" y="92.8" class="panel-text" font-size="3.6" text-anchor="middle" fill="#ffffff">TIME</text>
  <rect x="23.323" y="89.320" width="16.320" height="4.800" rx="1.440" fill="#000000" stroke="none" data-panel-role="label-bg" />
  <text x="31.483" y="92.8" class="panel-text" font-size="3.6" text-anchor="middle" fill="#ffffff">DENSITY</text>
  <rect x="41.970" y="89.320" width="3.360" height="4.800" rx="1.440" fill="#000000" stroke="none" data-panel-role="label-bg" />
  <text x="43.65" y="92.8" class="panel-text" font-size="3.6" text-anchor="middle" fill="#ffffff" font-style="italic">D</text>

  <!-- Bottom row (y=111.9) ? IN L, IN R, OUT L, OUT R -->
  <rect x="2.230" y="102.920" width="9.840" height="4.800" rx="1.440" fill="#000000" stroke="none" data-panel-role="label-bg" />
  <text x="7.15" y="106.4" class="panel-text" font-size="3.6" text-anchor="middle" fill="#ffffff">IN L</text>
  <rect x="14.397" y="102.920" width="9.840" height="4.800" rx="1.440" fill="#000000" stroke="none" data-panel-role="label-bg" />
  <text x="19.317" y="106.4" class="panel-text" font-size="3.6" text-anchor="middle" fill="#ffffff">IN R</text>
  <rect x="25.483" y="102.920" width="12.000" height="4.800" rx="1.440" fill="#000000" stroke="none" data-panel-role="label-bg" />
  <text x="31.483" y="106.4" class="panel-text" font-size="3.6" text-anchor="middle" fill="#ffffff">OUT L</text>
  <rect x="37.650" y="102.920" width="12.000" height="4.800" rx="1.440" fill="#000000" stroke="none" data-panel-role="label-bg" />
  <text x="43.65" y="106.4" class="panel-text" font-size="3.6" text-anchor="middle" fill="#ffffff">OUT R</text>

  <!-- NPTH drill layer overlay: solid black holes -->
  <g id="npth_drills" fill="#000000" stroke="none">
    <circle cx="25.400" cy="19.252" r="1.600" />
    <circle cx="8.650" cy="59.288" r="2.750" />
    <circle cx="7.150" cy="84.562" r="3.100" />
    <circle cx="7.150" cy="98.312" r="3.100" />
    <circle cx="7.150" cy="111.900" r="3.100" />
    <circle cx="19.317" cy="84.562" r="3.100" />
    <circle cx="19.317" cy="98.312" r="3.100" />
    <circle cx="19.317" cy="111.900" r="3.100" />
    <circle cx="25.503" cy="61.957" r="3.100" />
    <circle cx="31.483" cy="84.562" r="3.100" />
    <circle cx="31.483" cy="98.312" r="3.100" />
    <circle cx="31.483" cy="111.900" r="3.100" />
    <circle cx="42.155" cy="59.288" r="3.100" />
    <circle cx="43.650" cy="84.562" r="3.100" />
    <circle cx="43.650" cy="98.312" r="3.100" />
    <circle cx="43.650" cy="111.900" r="3.100" />
    <circle cx="11.176" cy="22.904" r="3.600" />
    <circle cx="11.176" cy="42.027" r="3.600" />
    <circle cx="39.650" cy="22.904" r="3.600" />
    <circle cx="39.650" cy="42.027" r="3.600" />
    <circle cx="6.500" cy="3.000" r="1.500" />
    <circle cx="8.500" cy="3.000" r="1.500" />
    <circle cx="42.100" cy="125.500" r="1.500" />
    <circle cx="44.100" cy="125.500" r="1.500" />
  </g>
  <!-- SD card holder cutout overlay: solid black slot from Edge_Cuts -->
  <g id="sd_slot" fill="#000000" stroke="none">
    <rect x="24.140" y="33.493" width="3.208" height="12.802" />
  </g>
</svg>
